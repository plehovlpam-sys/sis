<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Бонусная карта</title>
<style>

  @font-face {
    font-family: 'Master';
    src: url('./fonts/master.otf') format('opentype');
    font-weight: 400 800;
    font-display: swap;
  }
  @font-face {
    font-family: 'Masterun';
    src: url('./fonts/master4.ttf') format('truetype');
    font-weight: 400 700;
    font-display: swap;
  }

  :root{
    --ink:#0c0c0c;
    --red: #ff2d3a;
    --pink: #ff17c8;
    --gray-fill: #d9d7d1;
    --gray-dot: #cfcdc6;
    --font-head: 'Master', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
    --font-body: 'Masterun', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
    
    /* НАСТРОЙКИ РАЗМЕРОВ */
    --pill-padding: 37px 17px;
    --qr-size: 120px;
    --qr-gap: 7px;
    --border-radius-max: 34px;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0;
    padding:0;
    background: #ffffff;
    color: var(--ink);
    font-family: var(--font-body);
  }

  .page{
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    padding: 24px 18px 40px;
    border-radius: 0px;
    overflow: hidden;
    transition: border-radius 0.05s linear;
  }

  .viewport{
    position: relative;
    width: 100%;
    overflow: hidden;
    touch-action: pan-y;
    user-select: none;
    cursor: grab;
    border-radius: 0px;
    transition: border-radius 0.05s linear;
  }

  .track{
    display: flex;
    align-items: flex-start;
    width: 200%;
    transform: translateX(0%);
  }

  .slide{
    width: 50%;
    flex: 0 0 50%;
    box-sizing: border-box;
    padding: 0 2px;
  }

  .fx{
    width: 100%;
    will-change: transform, filter, opacity;
  }

  /* ---------- slide 1 : card + qr (по центру) ---------- */

  .card-row{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    gap: var(--qr-gap);
    position: relative;
  }

  .pill{
    position: relative;
    flex: 0 0 auto;
    display:flex;
    align-items:center;
    gap: 8px;
    padding: var(--pill-padding);
    border-radius: 999px;
    overflow: hidden;
    background: linear-gradient(115deg,
      var(--red) 0%, var(--pink) 22%, var(--red) 45%,
      var(--pink) 68%, var(--red) 88%, var(--pink) 100%);
    background-size: 320% 320%;
    animation: flow 7s ease-in-out infinite;
  }

  @keyframes flow{
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .pill-number{
    font-family: var(--font-head);
    font-weight: 800;
    color: #fff;
    font-size: 36px;
    line-height: 1;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }

  .pill-tag{
    flex: 0 0 auto;
    background: #fff;
    color: var(--ink);
    font-family: var(--font-head);
    font-weight: 800;
    font-size: 20px;
    padding: 7px 14px;
    border-radius: 999px;
    line-height: 1;
    white-space: nowrap;
  }

  .qr-wrapper {
    flex: 0 0 auto;
    width: var(--qr-size);
    height: var(--qr-size);
    display:flex;
    align-items:center;
    justify-content:center;
    background: #fff;
    border-radius: 999px;
    padding: 6px;
    pointer-events: none;
  }

  .qr-wrapper #qrcode {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qr-wrapper #qrcode img,
  .qr-wrapper #qrcode canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
    border-radius: 4px;
  }

  /* ---------- slide 2 : invite ---------- */

  .invite{
    width: 100%;
    background: var(--gray-fill);
    border-radius: 34px;
    padding: 26px 24px;
    display:flex;
    flex-direction: column;
    gap: 14px;
  }

  .invite h2{
    margin:0;
    font-family: var(--font-head);
    font-weight: 800;
    font-size: 26px;
    line-height: 1.06;
    text-transform: uppercase;
    letter-spacing: 0.005em;
  }

  .invite p{
    margin:0;
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 14.5px;
    line-height: 1.36;
    color: rgba(12,12,12,0.72);
    max-width: 94%;
  }

  .invite-btn{
    align-self: flex-start;
    margin-top: 4px;
    border: none;
    cursor: pointer;
    background: var(--ink);
    color: #fff;
    font-family: var(--font-head);
    font-weight: 800;
    font-size: 17px;
    text-transform: uppercase;
    padding: 13px 30px;
    border-radius: 999px;
    letter-spacing: 0.02em;
  }
  .invite-btn:active{ transform: scale(0.97); }

  /* ---------- indicator dots ---------- */

  .dots{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 8px;
    margin-top: 16px;
  }

  .dot{
    height: 9px;
    width: 9px;
    border-radius: 999px;
    background: var(--gray-dot);
    border: none;
    padding: 0;
    cursor: pointer;
    transition: width 0.35s cubic-bezier(.4,0,.2,1), background 0.35s ease;
  }

  .dot.active{
    width: 26px;
    background: var(--ink);
  }

</style>
</head>
<body>

<div class="page" id="page">
  <div class="viewport" id="viewport">
    <div class="track" id="track">

      <div class="slide" data-index="0">
        <div class="fx" id="fx-0">
          <div class="card-row">
            <div class="pill">
              <span class="pill-number">459 Б</span>
              <span class="pill-tag">*0039</span>
            </div>
            <div class="qr-wrapper">
              <div id="qrcode"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="slide" data-index="1">
        <div class="fx" id="fx-1">
          <div class="invite">
            <h2>Создайте карту<br>для близкого</h2>
            <p>Одним смахиванием переключайтесь между своей картой и картой для другого человека.</p>
            <button class="invite-btn" type="button">Начать</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="dots" id="dots">
    <button class="dot active" data-go="0" aria-label="Вкладка 1"></button>
    <button class="dot" data-go="1" aria-label="Вкладка 2"></button>
  </div>
</div>

<!-- Подключаем библиотеку QRCode -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

  // Генерация QR-кода с номером 9999
  (function() {
    var container = document.getElementById('qrcode');
    if (container && typeof QRCode !== 'undefined') {
      var qrSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--qr-size')) || 120;
      var innerSize = qrSize - 12;
      
      new QRCode(container, {
        text: '9999',
        width: innerSize,
        height: innerSize,
        colorDark: '#0c0c0c',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    }
  })();

</script>

<script>

  function initCarousel(){

    var viewport = document.getElementById('viewport');
    var track = document.getElementById('track');
    var page = document.getElementById('page');
    var fx = [document.getElementById('fx-0'), document.getElementById('fx-1')];
    var dots = Array.prototype.slice.call(document.querySelectorAll('.dot'));

    var COUNT = 2;
    var current = 0;
    var dragging = false;
    var animating = false;
    var startX = 0;
    var startY = 0;
    var dx = 0;
    var axis = null;
    var vw = viewport.getBoundingClientRect().width || 1;
    var heights = [0, 0];
    var maxRadius = 34;

    function measureHeights(){
      heights[0] = fx[0].offsetHeight;
      heights[1] = fx[1].offsetHeight;
    }

    function setViewportHeight(px, animate){
      viewport.style.transition = animate
        ? 'height 0.42s cubic-bezier(.22,.68,0,1)'
        : 'none';
      viewport.style.height = px + 'px';
    }

    function setBorderRadius(progress) {
      // progress: 0 - нет скругления, 1 - максимальное скругление
      var radius = progress * maxRadius;
      var radiusPx = radius + 'px';
      page.style.borderRadius = radiusPx;
      viewport.style.borderRadius = radiusPx;
    }

    measureHeights();
    setViewportHeight(heights[current], false);
    setBorderRadius(0);

    window.addEventListener('resize', function(){
      vw = viewport.getBoundingClientRect().width || 1;
      measureHeights();
      if(!dragging && !animating){
        setViewportHeight(heights[current], false);
      }
    });

    if(document.fonts && document.fonts.ready){
      document.fonts.ready.then(function(){
        measureHeights();
        if(!dragging && !animating){
          setViewportHeight(heights[current], false);
        }
      }).catch(function(){});
    }

    function setDots(idx){
      dots.forEach(function(d, i){
        d.classList.toggle('active', i === idx);
      });
    }

    function setTrackTransition(on){
      track.style.transition = on
        ? 'transform 0.42s cubic-bezier(.22,.68,0,1)'
        : 'none';
    }

    function setFxTransition(el, on){
      el.style.transition = on
        ? 'transform 0.42s cubic-bezier(.22,.68,0,1), filter 0.42s ease, opacity 0.42s ease'
        : 'none';
    }

    function resetFx(el){
      el.style.transform = 'scale(1)';
      el.style.filter = 'blur(0px)';
      el.style.opacity = '1';
    }

    fx.forEach(function(el){
      setFxTransition(el, false);
      resetFx(el);
    });

    function applyTrack(percent){
      track.style.transform = 'translateX(' + percent + '%)';
    }

    applyTrack(-current * 50);
    setDots(current);

    function applyDragVisual(p, dir){
      var leavingIdx = current;
      var enteringIdx = current + dir;

      var leaving = fx[leavingIdx];
      setFxTransition(leaving, false);
      leaving.style.transform = 'scale(' + (1 - 0.12 * p) + ')';
      leaving.style.filter = 'blur(' + (14 * p) + 'px)';
      leaving.style.opacity = String(1 - 0.45 * p);

      var interp = heights[leavingIdx];

      if(enteringIdx >= 0 && enteringIdx < COUNT){
        var entering = fx[enteringIdx];
        setFxTransition(entering, false);
        entering.style.transform = 'scale(' + (0.88 + 0.12 * p) + ')';
        entering.style.filter = 'blur(' + (14 * (1 - p)) + 'px)';
        entering.style.opacity = String(0.5 + 0.5 * p);
        interp = heights[leavingIdx] + (heights[enteringIdx] - heights[leavingIdx]) * p;
      }

      setViewportHeight(interp, false);

      var basePercent = -current * 50;
      var dragPercent = (dx / vw) * 50;
      setTrackTransition(false);
      applyTrack(basePercent + dragPercent);
      
      // Обновляем скругление в реальном времени в зависимости от прогресса
      setBorderRadius(p);
    }

    function animateTransition(targetIndex){
      animating = true;
      var startIndex = current;
      var dir = targetIndex > startIndex ? 1 : -1;

      if(targetIndex === startIndex){
        setTrackTransition(true);
        setViewportHeight(heights[startIndex], true);
        fx.forEach(function(el){
          setFxTransition(el, true);
          resetFx(el);
        });
        applyTrack(-startIndex * 50);
        window.setTimeout(function(){ 
          animating = false;
          setBorderRadius(0);
        }, 440);
        return;
      }

      var leaving = fx[startIndex];
      var entering = fx[targetIndex];

      setFxTransition(leaving, false);
      setFxTransition(entering, false);
      leaving.style.transform = 'scale(1)';
      leaving.style.filter = 'blur(0px)';
      leaving.style.opacity = '1';
      entering.style.transform = 'scale(0.88)';
      entering.style.filter = 'blur(14px)';
      entering.style.opacity = '0.5';

      void viewport.offsetHeight;

      current = targetIndex;
      setDots(current);

      setTrackTransition(true);
      setFxTransition(leaving, true);
      setFxTransition(entering, true);
      setViewportHeight(heights[current], true);

      leaving.style.transform = 'scale(0.88)';
      leaving.style.filter = 'blur(14px)';
      leaving.style.opacity = '0.5';
      entering.style.transform = 'scale(1)';
      entering.style.filter = 'blur(0px)';
      entering.style.opacity = '1';

      applyTrack(-current * 50);

      window.setTimeout(function(){
        resetFx(leaving);
        resetFx(entering);
        animating = false;
        setBorderRadius(0);
      }, 440);
    }

    function onDown(x, y){
      if(animating) return;
      dragging = true;
      startX = x;
      startY = y;
      dx = 0;
      axis = null;
    }

    function onMove(x, y){
      if(!dragging) return;
      var mx = x - startX;
      var my = y - startY;

      if(axis === null){
        if(Math.abs(mx) > 6 || Math.abs(my) > 6){
          axis = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
        }
      }
      if(axis !== 'x') return;

      dx = mx;
      var dir = dx < 0 ? 1 : -1;
      var target = current + dir;

      if(target < 0 || target >= COUNT){
        dx = 0;
        setTrackTransition(false);
        applyTrack(-current * 50);
        setBorderRadius(0);
        return;
      }

      var p = Math.max(0, Math.min(1, Math.abs(dx) / (vw * 0.55)));
      applyDragVisual(p, dir);
    }

    function onUp(){
      if(!dragging) return;
      dragging = false;
      
      if(axis !== 'x'){ 
        axis = null; 
        dx = 0; 
        setBorderRadius(0);
        return; 
      }
      axis = null;

      var dir = dx < 0 ? 1 : -1;
      var target = current + dir;
      var p = Math.abs(dx) / (vw * 0.55);

      if(target < 0 || target >= COUNT || Math.abs(dx) < 2){
        animateTransition(current);
        dx = 0;
        return;
      }

      if(p > 0.28){
        animateTransition(target);
      } else {
        animateTransition(current);
      }
      dx = 0;
    }

    viewport.addEventListener('touchstart', function(e){
      var t = e.touches[0];
      onDown(t.clientX, t.clientY);
    }, {passive:true});

    viewport.addEventListener('touchmove', function(e){
      var t = e.touches[0];
      onMove(t.clientX, t.clientY);
      if(axis === 'x' && e.cancelable) e.preventDefault();
    }, {passive:false});

    viewport.addEventListener('touchend', onUp, {passive:true});
    viewport.addEventListener('touchcancel', onUp, {passive:true});

    viewport.addEventListener('mousedown', function(e){
      onDown(e.clientX, e.clientY);
    });
    window.addEventListener('mousemove', function(e){
      onMove(e.clientX, e.clientY);
    });
    window.addEventListener('mouseup', onUp);

    dots.forEach(function(d){
      d.addEventListener('click', function(){
        if(animating) return;
        var idx = parseInt(d.getAttribute('data-go'), 10);
        if(idx === current) return;
        animateTransition(idx);
      });
    });

  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initCarousel);
  } else {
    initCarousel();
  }

</script>

</body>
</html>
